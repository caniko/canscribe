# Generated by simit. Manual edits will be reported as ci=drift.
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
      XDG_CACHE_HOME: "/tmp/.cache"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Check generated flake wiring
        run: nix run --no-write-lock-file git+https://github.com/caniko/simit.git -- init flake --check --diff

      - name: Check flake evaluation
        run: nix flake check --no-build

      - name: Build check flake-eval
        run: nix build .#checks.x86_64-linux.flake-eval

      - name: Build check offline-tests
        run: nix build .#checks.x86_64-linux.offline-tests

      - name: Build check typecheck
        run: nix build .#checks.x86_64-linux.typecheck
