name: Published package metadata

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Install metadata tools
        run: python -m pip install uv==0.8.23 packaging==25.0
      - name: Regenerate the repository lock
        run: uv lock
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uv-lock-${{ github.sha }}
          path: uv.lock
          if-no-files-found: error
      - name: Check published requirements
        run: |
          uv build --wheel
          python nix/package-metadata-test.py dist/*.whl
      - name: Check committed lock is current
        run: git diff --exit-code -- uv.lock
