[project]
name = "can-transcribe"
version = "0.1.0"
description = "Simple audio transcription CLI that uses cutting edge models 🤖"
authors = [
    { name = "Can H. Tartanoglu", email = "gpg@rotas.mozmail.com" }
]
requires-python = "==3.13.*"
dependencies = [
    "pyannote.audio",
    "torch",
    "torchaudio",
    "transformers",
    "typer",
]

[project.scripts]
ct = "can_transcribe.main:main"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[dependency-groups]
dev = [
    "mypy",
]

[build-system]
requires = ["uv_build>=0.8.23,<0.9.0"]
build-backend = "uv_build"
