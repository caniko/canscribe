[project]
name = "can-transcribe"
version = "0.1.0"
description = "Simple audio transcription CLI that uses cutting edge models 🤖"
authors = [
    { name = "Can H. Tartanoglu", email = "gpg@rotas.mozmail.com" }
]
requires-python = "==3.13.*"
dependencies = [
    "pyannote.audio",
    "torch",
    "torchaudio",
    "torchvision",
    "transformers>=4.57.0",
    "typer",
    # Visual analysis
    "insightface",
    "scenedetect",  # opencv provided by Nix (opencv4Full with VAAPI)
    "scikit-learn",
    "onnxruntime-gpu",
    "timm",  # For HuggingFace vision models
]

[project.optional-dependencies]
flash = ["flash-attn"]

[project.scripts]
ct = "can_transcribe.main:main"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]

[dependency-groups]
dev = [
    "mypy",
]

[build-system]
requires = ["uv_build>=0.8.23,<0.9.0"]
build-backend = "uv_build"
