[project]
name = "canscribe"
version = "0.1.0"
description = "Simple audio transcription CLI that uses cutting edge models"
authors = [{ name = "Can H. Tartanoglu", email = "gpg@rotas.mozmail.com" }]
requires-python = "==3.13.*"

# Base dependencies (platform-agnostic; extras select the PyTorch runtime)
dependencies = [
  "pyannote.audio",
  # torchcodec wheels don't declare their torch requirement; a mismatched
  # pair aborts at import (op registration). 0.8.x pairs with torch 2.9.x —
  # bump together with the torch pin below.
  "torchcodec>=0.8,<0.9",
  # These bounds must be published, not just enforced by uv in this checkout.
  "torch>=2.9.1,<2.10",
  "torchaudio>=2.9.1,<2.10",
  # Parakeet TDT needs the TDT decoder, which only landed in Transformers 5.x.
  "transformers>=5.0.0",
  "librosa",             # required by transformers' ParakeetFeatureExtractor
  "typer",
  # Visual analysis
  "insightface",
  "opencv-python-headless", # Fallback; Nix provides opencv4 with VAAPI via PYTHONPATH
]

[project.optional-dependencies]
# Platform extras (mutually exclusive)

# NVIDIA CUDA 12.8 - Full GPU acceleration
nvidia = [
  "torch>=2.9.1,<2.10",
  "torchaudio>=2.9.1,<2.10",
  "torchvision>=0.24.1,<0.25",
  "onnxruntime-gpu",
]

# AMD ROCm 6.4 - Linux only
amd = [
  "torch>=2.9.1,<2.10",
  "torchaudio>=2.9.1,<2.10",
  "torchvision>=0.24.1,<0.25",
  "onnxruntime",
  "pytorch-triton-rocm>=3.5.1 ; sys_platform == 'linux'",
]

# Apple Silicon - MPS acceleration built into PyPI wheels
apple = [
  "torch>=2.9.1,<2.10",
  "torchaudio>=2.9.1,<2.10",
  "torchvision>=0.24.1,<0.25",
  "onnxruntime",
]

# CPU only - No GPU acceleration (smaller download)
cpu = [
  "torch>=2.9.1,<2.10",
  "torchaudio>=2.9.1,<2.10",
  "torchvision>=0.24.1,<0.25",
  "onnxruntime",
]

# Flash Attention 2 - NVIDIA Ampere+ only (CC 8.0+)
flash = ["flash-attn"]

[project.scripts]
canscribe = "canscribe.main:main"
ct = "canscribe.main:main"

# ============================================================
# UV Configuration
# ============================================================

[tool.uv]
# TorchCodec 0.8 uses the PyTorch 2.9 ABI. Its wheels do not encode this
# dependency, so constrain every source route, including pyannote's base deps.
constraint-dependencies = [
  "torch>=2.9.1,<2.10",
  "torchaudio>=2.9.1,<2.10",
  "torchvision>=0.24.1,<0.25",
]

# Published PyPI/egg-info metadata for the locked source-only packages.
# Lock resolution does not need their CUDA/Cython build environments.
dependency-metadata = [
  { name = "flash-attn", version = "2.8.3", requires-dist = ["torch", "einops"], requires-python = ">=3.9" },
  { name = "insightface", version = "0.7.3", requires-dist = ["Pillow", "albumentations", "cython", "easydict", "matplotlib", "numpy", "onnx", "prettytable", "requests", "scikit-image", "scikit-learn", "scipy", "tqdm"] },
  { name = "julius", version = "0.2.7", requires-dist = ["torch>=1.7.0", "coverage; extra == 'dev'", "flake8; extra == 'dev'", "mypy; extra == 'dev'", "onnxruntime; extra == 'dev'", "resampy==0.2.2; extra == 'dev'", "pdoc3; extra == 'dev'"], requires-python = ">=3.6.0", provides-extra = ["dev"] },
]

# Platform extras are mutually exclusive
conflicts = [
  [
    { extra = "nvidia" },
    { extra = "amd" },
    { extra = "apple" },
    { extra = "cpu" },
  ],
]

# Index definitions
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm64"
url = "https://download.pytorch.org/whl/rocm6.4"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Source routing by platform extra
[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", extra = "nvidia" },
  { index = "pytorch-rocm64", extra = "amd" },
  { index = "pytorch-cpu", extra = "cpu" },
]
torchaudio = [
  { index = "pytorch-cu128", extra = "nvidia" },
  { index = "pytorch-rocm64", extra = "amd" },
  { index = "pytorch-cpu", extra = "cpu" },
]
torchvision = [
  { index = "pytorch-cu128", extra = "nvidia" },
  { index = "pytorch-rocm64", extra = "amd" },
  # Keep the index-only local version out of published requirements. Pin the
  # Linux CPython 3.13 wheel here so uv cannot select the Windows ARM build.
  { url = "https://download-r2.pytorch.org/whl/cpu/torchvision-0.24.1%2Bcpu-cp313-cp313-manylinux_2_28_x86_64.whl", extra = "cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'linux' or platform_machine != 'x86_64'" },
]
pytorch-triton-rocm = [{ index = "pytorch-rocm64", extra = "amd" }]
[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]

# ============================================================
# Development & Build
# ============================================================

[dependency-groups]
dev = ["mypy", "pytest>=8.0", "ruff"]

[build-system]
requires = ["uv_build>=0.8.23,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not integration"]
markers = [
  "integration: marks tests as integration tests (may require GPU, HF_TOKEN)",
  "slow: marks tests as slow integration tests",
]

[tool.mypy]
exclude = ["^\\.venv/"]
