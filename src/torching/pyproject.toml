[project]
name = "torching"
version = "0.1.0"
description = "Environment validation CLI for canscribe — checks GPU lib paths, LD_LIBRARY_PATH, and common runtime issues"
requires-python = "==3.13.*"
dependencies = [
    "typer",
]

[project.scripts]
torching = "torching.main:cli"

[build-system]
requires = ["uv_build>=0.8.23,<0.9.0"]
build-backend = "uv_build"

[tool.mypy]
strict = true
