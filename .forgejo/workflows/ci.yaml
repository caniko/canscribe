# Generated by simit. Manual edits will be reported as ci=drift.
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: atlas
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
      XDG_CACHE_HOME: "/tmp/.cache"
      CARGO_HOME: "/tmp/.cargo"
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Check generated flake wiring
        run: nix run git+https://codeberg.org/caniko/simit.git -- init flake --check --diff

      - name: Check flake evaluation
        run: nix flake check --no-build

      - name: Build check flake-eval
        run: nix build .#checks.x86_64-linux.flake-eval

      - name: Build check offline-tests
        run: nix build .#checks.x86_64-linux.offline-tests

      - name: Build check typecheck
        run: nix build .#checks.x86_64-linux.typecheck

      - name: Build check uv-format
        run: nix build .#checks.x86_64-linux.uv-format
