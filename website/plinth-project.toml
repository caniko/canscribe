[[pages.sections]]
type = "hero"
title = "canscribe"
tagline = "Transcribe audio and video with speaker labels and optional visual context."
subtitle = "canscribe combines FFmpeg extraction, pyannote diarization, Parakeet or Moonshine speech-to-text, and a diagnostic CLI for GPU-backed transcription workflows."

[[pages.sections.ctas]]
label = "Read the docs"
href = "/canscribe/docs/"
primary = true

[[pages.sections.ctas]]
label = "View source"
href = "https://codeberg.org/caniko/canscribe"

[[pages.sections]]
type = "feature_grid"
id = "overview"

[[pages.sections.features]]
title = "Speaker-aware transcripts"
description = "pyannote diarization identifies speaker segments before ASR, producing timestamped transcript lines with speaker labels."
highlight = true

[[pages.sections.features]]
title = "Video input support"
description = "FFmpeg extracts audio from common video containers so meetings, recordings, and clips can be transcribed directly."

[[pages.sections.features]]
title = "GPU backend choices"
description = "uv extras cover NVIDIA CUDA 12.8, AMD ROCm 6.4, Apple Silicon MPS, and CPU-only environments."

[[pages.sections.features]]
title = "Visual mode"
description = "Optional frame routing analyzes speaking faces, static faces, or no-face scenes and attaches visual context to transcript segments."

[[pages.sections.features]]
title = "Streaming output"
description = "Transcript files are written incrementally as segments are processed instead of waiting for the full media file to finish."

[[pages.sections.features]]
title = "System diagnostics"
description = "The check command probes GPU availability, FFmpeg, torchcodec, pyannote imports, and video decoding behavior."

[[pages.sections]]
type = "workflow_steps"
id = "workflow"
heading = "From shell to transcript"
intro = "The normal path is to enter the Nix shell, sync one platform extra, export the Hugging Face token, then run the CLI on an audio or video file."

[[pages.sections.steps]]
title = "Enter the shell"
description = "nix develop"

[[pages.sections.steps]]
title = "Sync dependencies"
description = "uv sync --extra nvidia"

[[pages.sections.steps]]
title = "Set model access"
description = "export HF_TOKEN=hf_your_token_here"

[[pages.sections.steps]]
title = "Transcribe media"
description = "canscribe ~/Videos/meeting.mp4"

[[pages.sections]]
type = "trust_panel"
id = "operations"
heading = "Built for local operation"
intro = "The repository keeps runtime setup, diagnostics, and release artifacts inspectable through Python project metadata and a Nix flake."

[[pages.sections.items]]
title = "Reproducible development shell"
description = "The flake provides Python 3.13, uv, FFmpeg, OpenCV, native libraries, and helper commands for tests and smoke checks."

[[pages.sections.items]]
title = "Explicit model boundaries"
description = "ASR, diarization, face analysis, and scene analysis models are selected through documented backends rather than hidden services."

[[pages.sections.items]]
title = "Docs deployed with the site"
description = "The Codeberg Pages output contains the project landing page at the root and mdBook documentation under /docs/."
